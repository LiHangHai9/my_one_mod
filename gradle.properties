# ============================================================
#  Fabric 1.21.1 模组工程配置
#  用 JDK 25 运行 Gradle（Loom 1.18 要求 JVM 25），代码编译目标仍是 Java 21
# ============================================================

# --- 构建优化 ---
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# --- 模组信息 ---
version=1.0.0
group=com.lihanghai

# --- Fabric 版本 ---
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.116.17+1.21.1

# --- 本工程强制使用 JDK 25 ---
org.gradle.java.home=D:/environment/minecraft/1.21.1-Fabric/JDK-25

# --- 网络超时加大 ---
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000

# ============================================================
# 国内镜像加速
# ============================================================
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json
loom_fabric_repository=https://repository.hanbings.io/proxy
