// Fabric 1.21.1 构建脚本（跟随官方 fabric-example-mod 模板）
plugins {
	// 关键点：新版统一用 fabric-loom-remap（1.21.1 这类旧混淆版本也用它）
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	// 把 main 和 client 拆成两个源集：服务端/通用代码放 src/main，客户端专用代码放 src/client
	splitEnvironmentSourceSets()
	mods {
		// modid 对应 fabric.mod.json 里的 id
		"my_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// 仓库源：全部走国内镜像，绕开国外慢速/断流的源
repositories {
	maven {
		name = 'FabricMirror'
		url = 'https://repository.hanbings.io/proxy'
	}
	maven {
		name = 'Aliyun'
		url = 'https://maven.aliyun.com/repository/public'
	}
}

dependencies {
	// Minecraft 本体
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 官方 Mojang 映射
	mappings loom.officialMojangMappings()
	// Fabric 加载器
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
